name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, claude/atlas-emotions-korean-g4IHW ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List dist contents
        run: |
          echo "=== dist folder contents ==="
          ls -la dist/
          echo "=== dist/assets contents ==="
          ls -la dist/assets/
          echo "=== index.html content ==="
          cat dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: emotion.trinos.group
